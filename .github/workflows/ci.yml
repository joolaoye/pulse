name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check src tests bootstrap.py

      - name: Ruff format
        run: uv run ruff format --check src tests bootstrap.py

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest
