name: Bug report
description: Report a reproducible problem with Pulse.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem with Pulse.

        Please include enough information for the issue to be reproduced without exposing API keys, tokens, feed URLs, or other secrets.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect Pulse to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence of steps that reproduces the issue.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Execution environment
      options:
        - Local CLI
        - Cloudflare Worker / Workflow
        - Both
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Pulse version
      description: Release tag, commit SHA, or branch.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: |
        Paste relevant logs, stack traces, run IDs, or CLI output.
        Remove secrets and private URLs before submitting.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that may help diagnose the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, credentials, and private URLs from the report.
          required: true